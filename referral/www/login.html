{% extends "templates/web.html" %}

{% block title %}Sign In — SEARCH Gadchiroli{% endblock %}

{% block head_include %}
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
    /* ── Base overrides ───────────────────────────────────────── */
    body {
        background: radial-gradient(circle at top right, #f8fafc, #f1f5f9) !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
        color: #1e293b;
        margin: 0;
        padding: 0;
    }

    .page-header, .breadcrumb, .navbar, .web-footer { display: none !important; }

    /* ── Login container ──────────────────────────────────────── */
    #login-root {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .login-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
        width: 100%;
        max-width: 440px;
        padding: 40px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    /* ── Header ───────────────────────────────────────────────── */
    .login-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .login-logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin: 0 auto 16px;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .login-title {
        font-size: 24px;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 8px;
        letter-spacing: -0.025em;
    }

    .login-subtitle {
        font-size: 14px;
        color: #64748b;
        margin: 0;
    }

    /* ── Form elements ────────────────────────────────────────── */
    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #475569;
        margin-bottom: 6px;
    }

    .form-input {
        width: 100%;
        padding: 12px 16px;
        font-size: 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        background: #f8fafc;
        box-sizing: border-box;
    }

    .form-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        background: #ffffff;
    }

    /* ── Button ───────────────────────────────────────────────── */
    .btn-submit {
        width: 100%;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }

    .btn-submit:hover {
        opacity: 0.95;
    }

    .btn-submit:active {
        transform: scale(0.98);
    }

    .btn-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    /* ── Feedback Message ──────────────────────────────────────── */
    .login-feedback {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        display: none;
        animation: fadeIn 0.2s ease;
        text-align: center;
    }

    .feedback-error {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #dc2626;
    }

    .feedback-success {
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        color: #16a34a;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ── Spinner ──────────────────────────────────────────────── */
    .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s ease-in-out infinite;
        margin-right: 8px;
        vertical-align: middle;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block page_content %}
<div id="login-root">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">🏥</div>
            <h1 class="login-title">SEARCH Gadchiroli</h1>
            <p class="login-subtitle">Sign in to access your dashboard and tools</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="username">Username or Email</label>
                <input class="form-input" type="text" id="username" name="username" placeholder="name@example.com" required autocomplete="username" />
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
            </div>

            <button class="btn-submit" type="submit" id="btn-login-submit">
                Sign In
            </button>
        </form>

        <div class="login-feedback feedback-error" id="login-error-msg"></div>
        <div class="login-feedback feedback-success" id="login-success-msg"></div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const form = document.getElementById("login-form");
        const submitBtn = document.getElementById("btn-login-submit");
        const errorMsg = document.getElementById("login-error-msg");
        const successMsg = document.getElementById("login-success-msg");

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            // Clear feedback
            errorMsg.style.display = "none";
            successMsg.style.display = "none";

            const usr = document.getElementById("username").value.trim();
            const pwd = document.getElementById("password").value;

            if (!usr || !pwd) {
                showError("Both login and password are required.");
                return;
            }

            // Set loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Signing in...';

            // standard AJAX post to /api/method/login
            $.ajax({
                type: "POST",
                url: "/api/method/login",
                data: {
                    usr: usr,
                    pwd: pwd
                },
                dataType: "json",
                success: function(res) {
                    if (res.message === "Logged In" || res.message === "No App") {
                        successMsg.innerText = "Authentication successful! Redirecting...";
                        successMsg.style.display = "block";
                        
                        // Redirect to redirect-to param or portal
                        const urlParams = new URLSearchParams(window.location.search);
                        let redirectTo = urlParams.get("redirect-to") || "/portal";
                        
                        if (redirectTo === "/login" || redirectTo === "login") {
                            redirectTo = "/portal";
                        }
                        
                        window.location.href = redirectTo;
                    } else {
                        showError("Login failed. Please check your credentials.");
                        resetButton();
                    }
                },
                error: function(xhr) {
                    let message = "Invalid username or password.";
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        message = xhr.responseJSON.message;
                    }
                    showError(message);
                    resetButton();
                }
            });
        });

        function showError(msg) {
            errorMsg.innerText = msg;
            errorMsg.style.display = "block";
        }

        function resetButton() {
            submitBtn.disabled = false;
            submitBtn.innerHTML = "Sign In";
        }
    });
</script>
{% endblock %}
